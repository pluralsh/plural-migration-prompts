apiVersion: deployments.plural.sh/v1alpha1
kind: GitRepository
metadata:
  name: platform-infra
spec:
  url: ssh://git@github.com/acme/platform-infra.git
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  namespace: ingress-nginx
  helm:
    chart: ingress-nginx
    version: 4.10.1
    url: https://kubernetes.github.io/ingress-nginx
    values:
      controller:
        replicaCount: 2
  cluster: prod-us-east-1
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: payments-prod
  namespace: payments
spec:
  namespace: payments
  repositoryRef:
    kind: GitRepository
    name: platform-infra
  git:
    ref: main
    folder: services/payments/overlays/prod
  dependencies:
    - name: ingress-nginx
  cluster: prod-us-east-1
