apiVersion: deployments.plural.sh/v1alpha1
kind: GitRepository
metadata:
  name: platform-infra
spec:
  url: ssh://git@github.com/acme/platform-infra.git
---
apiVersion: deployments.plural.sh/v1alpha1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: infra
spec:
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  namespace: ingress-nginx
  helm:
    chart: ingress-nginx
    version: 4.10.1
    repository:
      name: ingress-nginx
      namespace: infra
    values:
      controller:
        replicaCount: 2
  clusterRef:
    kind: Cluster
    name: prod-us-east-1
    namespace: infra
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: payments-prod
  namespace: payments
spec:
  namespace: payments
  repositoryRef:
    kind: GitRepository
    name: platform-infra
  git:
    ref: main
    folder: services/payments/overlays/prod
  dependencies:
    - name: ingress-nginx
  clusterRef:
    kind: Cluster
    name: prod-us-east-1
    namespace: infra
